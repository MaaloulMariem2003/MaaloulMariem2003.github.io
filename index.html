<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mariem Maaloul Github Document</title>
  <!--Faire l'apparance de la page-->
  <style>
    :root {
      --bg: #f3f8f2;
      --surface: #ffffff;
      --text: #14301c;
      --muted: #4d6b56;
      --green: #1f8a4c;
      --green-hover: #176c3b;
      --on-green: #ffffff;
      --border: #cfe3d3;
    }
    :root[data-theme="dark"] {
      --bg: #0f1a13;
      --surface: #172619;
      --text: #e6f3e8;
      --muted: #9dbaa4;
      --green: #4cc27a;
      --green-hover: #6fd695;
      --on-green: #0b1a10;
      --border: #27402d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background .3s, color .3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }
    header strong { font-size: 1.15rem; }
    main { max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.15; margin: 0 0 1rem; }
    p { color: var(--muted); font-size: 1.1rem; max-width: 60ch; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--green);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-top: 2rem;
    }
    .card h2 { margin: 0 0 .25rem; font-size: 1.2rem; }
    .card p { margin: 0; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 999px;
      padding: .55rem 1.2rem;
      border: 2px solid var(--green);
      transition: background .2s, color .2s;
    }
    .btn-green { background: var(--green); color: var(--on-green); margin-top: 1.5rem; font-size: 1.05rem; }
    .btn-green:hover { background: var(--green-hover); border-color: var(--green-hover); }
    /* #theme-toggle { background: transparent; color: var(--text); } */
    /* #theme-toggle:hover { background: var(--green); color: var(--on-green); } */
    button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

      /*Changer le boutton par un switcheur des thèmes*/
        .switch {
      position: relative;
      width: 56px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      border: 2px solid var(--green);
      background: var(--surface);
      flex-shrink: 0;
    }
    .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--green);
      transition: transform .25s;
    }
    .switch[aria-checked="true"] .knob {
      transform: translateX(26px);
    }
  </style>
</head>
<body>
  <header>
    <strong>Works and Projects by Mariem Maaloul</strong>
    <!--<button id="theme-toggle" type="button" aria-label="Toggle dark mode"> Dark mode</button>-->
    <button id="theme-toggle" class="switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="knob"></span>
    </button>
  </header>

  <main>
    <h1>Hello, world!</h1>
    <p>This is my GitHub Pages site. Edit this text to tell people who you are and what you make.</p>

    <div class="card">
      <h2>About me</h2>
      <p>Write a short introduction here.</p>
    </div>

    <button class="btn-green" type="button" onclick="alert('Thanks for visiting!')">Say hello</button>
  </main>

  <!-- La fonctionnalité des bouttons utilisés-->
  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      /*toggle.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';*/
      toggle.setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
    }

    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));

    toggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  </script>
</body>
</html>
